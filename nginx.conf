# Nginx Configuration for HelloIT Solutions Website
# Location on server: /etc/nginx/sites-available/itcompany
# Symlinked to: /etc/nginx/sites-enabled/itcompany

server {
    listen 80;
    listen [::]:80;

    # Replace with your custom domain name (e.g., helloitsolutions.com www.helloitsolutions.com)
    # or keep '_' for direct IP address access
    server_name _;

    # Root web directory on Ubuntu EC2
    root /var/www/itcompany;
    index index.html;

    # Enable High-Performance Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/json 
        application/javascript 
        application/x-javascript 
        application/xml 
        application/xml+rss 
        image/svg+xml;

    # Primary Routing
    location / {
        try_files $uri $uri/ =404;
    }

    # Browser Static Asset Caching for Fast Page Loads (30 Days)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
}
